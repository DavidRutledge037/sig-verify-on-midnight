<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuit-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Circuit Lines -->
      <path d="M10 50 L40 50 M60 50 L90 50" stroke="#333" stroke-width="2" fill="none"/>
      <path d="M50 10 L50 40 M50 60 L50 90" stroke="#333" stroke-width="2" fill="none"/>
      <!-- Circuit Nodes -->
      <circle cx="50" cy="50" r="4" fill="#333"/>
      <circle cx="10" cy="50" r="3" fill="#333"/>
      <circle cx="90" cy="50" r="3" fill="#333"/>
      <circle cx="50" cy="10" r="3" fill="#333"/>
      <circle cx="50" cy="90" r="3" fill="#333"/>
      <!-- Additional Circuit Elements -->
      <path d="M70 30 L80 40 M70 40 L80 30" stroke="#333" stroke-width="1.5" fill="none"/>
      <path d="M20 70 Q35 70 35 85" stroke="#333" stroke-width="1.5" fill="none"/>
    </pattern>
  </defs>
  <!-- Background with Pattern -->
  <rect width="100%" height="100%" fill="url(#circuit-pattern)"/>
</svg>
